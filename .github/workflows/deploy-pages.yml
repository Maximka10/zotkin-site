name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Migrate HTML sources to TypeScript
        run: |
          node --experimental-strip-types tools/migrate-pages.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages src/pages-ts
            git commit -m "Migrate site pages to TypeScript [skip ci]"
            git push
          fi

      - name: Install dependencies
        run: npm install

      - name: Generate public site from TypeScript pages
        run: node --experimental-strip-types tools/build-site.ts

      - name: Compile browser TypeScript
        run: npm run build

      - name: Enable UI refresh layer
        run: |
          for file in dist/*.html; do
            if ! grep -q 'ui-refresh.js' "$file"; then
              perl -0pi -e 's#</body>#  <script src="ui-refresh.js" defer></script>\n</body>#i' "$file"
            fi
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
