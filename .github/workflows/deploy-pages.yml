name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate public site from TypeScript
        run: node --experimental-strip-types tools/build-site.ts

      - name: Compile browser TypeScript
        run: npm run build

      - name: Verify generated site
        run: |
          set -e
          test -f dist/index.html
          test -f dist/services.html
          test -f dist/about.html
          test -f dist/equipment.html
          test -f dist/licenses.html
          test -f dist/contacts.html
          test -f dist/privacy.html
          test -f dist/site-enhance.js
          test -f dist/ui-refresh.js
          grep -q 'site-enhance.js' dist/index.html
          grep -q 'ui-refresh.js' dist/index.html
          if grep -R -q 'document.addEventListener("DOMContentLoaded"' dist/*.html; then
            echo 'Unexpected legacy inline UI script found.'
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
